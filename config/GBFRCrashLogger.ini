; GBFR Crash Logger settings (0 = off, 1 = on)
[Logger]
; Turn on the D3D11 debug layer (needs Windows Settings > Optional features > 'Graphics Tools'). Slower, but explains GPU errors.
DebugLayer=0
; Also log debug-layer warnings (noisy)
LogWarnings=0
; Save every shader the game creates to CrashLogger\shaders (failed ones are always saved)
DumpShaders=0
; Log every shader creation
LogShaderCreates=0
; Seconds without a frame (or window Not Responding) before a hang report is written
HangSeconds=30
; Full-memory minidumps (several GB) instead of small ones
FullDump=0
; Write a full report on the first access violation even if the game might handle it
FirstChanceAVReport=0
MaxFirstChanceLines=100
HeartbeatSeconds=60
; Performance summary every N seconds (fps, 1% low, stutters, VRAM). 0 = off
PerfSeconds=10
; Log each frame that takes at least this many ms
StutterMs=100
; Create a hidden test device at startup so hooks are in place before the game's renderer starts
ProbeD3D=0
; Seconds after launch without a D3D11 device before a startup-hang report (0 = off)
StartupHangSeconds=25

; Environment variables set for the game process only, before DXVK/Vulkan start.
[Environment]
; Old Intel HD 530 Vulkan driver (igvk64) re-enters DXVK dxgi.dll during startup and deadlocks it.
VK_LOADER_DRIVERS_DISABLE=*igvk*

; DLLs the game may not load (appear missing, like under Proton). Set name=0 to allow it again.
[BlockDlls]
nvapi64.dll=1
