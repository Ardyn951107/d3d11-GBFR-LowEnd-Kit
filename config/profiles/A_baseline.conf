# A - BASELINE MEASURE (same rendering as your last run, plus measurement HUD and no vsync)
# --- Relink profile (DXVK only applies it to granblue_fantasy_relink.exe, so set by hand) ---
d3d11.relaxedGraphicsBarriers = True
d3d11.exposeDriverCommandLists = False
dxgi.hideNvidiaGpu = False
dxvk.enableNvRawAccessChains = False
dxvk.deviceFilter = "GTX 960M"

d3d11.maxFeatureLevel = 12_1
# Present without vsync so the HUD shows the real frame rate (the in-game cap still applies)
dxgi.syncInterval = 0
# HUD: fps + frame times + GPU load (near 100% = GPU-bound) + VRAM + draw calls
dxvk.hud = fps,frametimes,gpuload,memory,drawcalls,submissions,pipelines,compiler,version
