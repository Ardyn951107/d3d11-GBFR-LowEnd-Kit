# E - STEADY PACING for the GTX 960M at 720p
# The GPU averages ~44 ms/frame at 720p, so a 30 fps target makes frames alternate
# between 33 / 50 / 66 ms (felt as stutter). DXVK's limiter holds an even 40 ms/frame.
# Raise to 30 once lower settings (or GBFRelinkFix shadows/TAA) get the median under ~30 ms.
# --- Relink profile (DXVK only applies it to granblue_fantasy_relink.exe, so set by hand) ---
d3d11.relaxedGraphicsBarriers = True
d3d11.exposeDriverCommandLists = False
dxgi.hideNvidiaGpu = False
dxvk.enableNvRawAccessChains = False
dxvk.deviceFilter = "GTX 960M"
d3d11.maxFeatureLevel = 12_1

# Even frame pacing: DXVK frame limiter
dxgi.maxFrameRate = 25
# No vsync quantisation (60 Hz vsync would snap ~25 fps to an uneven 30/20 pattern)
dxgi.syncInterval = 0

# Light HUD (the full HUD costs a little GPU time); remove the line when done testing
dxvk.hud = fps,frametimes,gpuload